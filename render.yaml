# Render Blueprint for the API. Secrets are marked sync: false, so Render asks for them on
# first deploy and they never live in the repo.
services:
  - type: web
    name: ai-interviewer-api
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: TRUST_PROXY
        value: "1"
      - key: MONGODB_URI
        sync: false
      - key: OPENAI_COMPAT_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: CLIENT_ORIGIN # the Vercel URL, e.g. https://ai-interviewer.vercel.app
        sync: false
